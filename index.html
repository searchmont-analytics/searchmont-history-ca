<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Searchmont History</title>
  <meta name="description" content="Uncovering Searchmont's History: photos, documents and films of the Searchmont townsite, its people, logging, the railway and more.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="bar">
      <a class="brand" href="#/">
        <span class="brand-small">Uncovering</span>
        <span class="brand-big">Searchmont's History</span>
      </a>
      <button class="menu-btn" aria-expanded="false" aria-controls="topnav">
        <span aria-hidden="true">☰</span> Topics
      </button>
    </div>
    <nav id="topnav" class="topnav" aria-label="Topics"></nav>
  </header>

  <main id="main" tabindex="-1"></main>

  <footer class="site-footer">
    <p>Searchmont History · Photos and documents shared by the Searchmont community.</p>
  </footer>

  <!-- Photo viewer -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
    <div class="lb-top">
      <span class="lb-count" id="lb-count"></span>
      <a class="lb-btn" id="lb-full" target="_blank" rel="noopener">Full size ↗</a>
      <button class="lb-btn" id="lb-close" aria-label="Close viewer">✕ Close</button>
    </div>
    <div class="lb-stage" id="lb-stage">
      <button class="lb-nav prev" id="lb-prev" aria-label="Previous photo">‹</button>
      <img id="lb-img" alt="">
      <button class="lb-nav next" id="lb-next" aria-label="Next photo">›</button>
    </div>
    <p class="lb-caption" id="lb-caption"></p>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
